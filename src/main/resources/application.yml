server:
  port: ${SERVER_PORT:8010}
spring:
  application:
    name: base-organization
  cloud:
    nacos:
      discovery:
        server-addr: ${REGISTER_HOST:localhost}:${REGISTER_PORT:8848}
        ip: ${NACOS_DISCOVERY_IP:}
        metadata:
          management.host: ${MANAGEMENT_SERVER_HOST:${spring.application.name}}
          management.port: ${MANAGEMENT_SERVER_PORT:18080}
          management.scheme: ${MANAGEMENT_SERVER_SCHEME:http}
      config:
        server-addr: ${REGISTER_HOST:localhost}:${REGISTER_PORT:8848}
        file-extension: yml
  config:
    import: optional:nacos:${OPENSABRE_COMMON_CONFIG_DATA_ID:opensabre-common.yml}?group=${OPENSABRE_COMMON_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 300
      #password: ${REDIS_PASSWORD:123456}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:${DATASOURCE_DBTYPE:mysql}://${DATASOURCE_HOST:localhost}:${DATASOURCE_PORT:3306}/os_base_organization?characterEncoding=UTF-8&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DATASOURCE_USERNAME:root}
    password: ${DATASOURCE_PASSWORD:root123}
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 20
# opensabre framework配置
opensabre:
  sensitive:
    log:
      enabled: false # 日志脱敏开关，默认关闭
      rules: mobile,idCard,phone,email
  rest:
    swagger:
      version: v0.0.1
      title: Opensabre Organization API
      description: Opensabre Organization REST API
      licenseUrl: https://github.com/opensabre/base-organization
      licenseName: Apache 2.0
      wikiUrl: https://opensabre.github.io/docs
      wikiDocumentation: Opensabre Organization Wiki Documentation

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:18080}
    ssl:
      enabled: ${MANAGEMENT_SERVER_SSL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: '*'
  tracing:
    sampling:
      probability: 1.0


logging:
  level:
    io.github.opensabre: debug
    java.sql.PreparedStatement: debug
  pattern:
    level: '%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{parentSpanId:-}]'

mybatis-plus:
  global-config:
    db-config:
      table-prefix: base_org_
